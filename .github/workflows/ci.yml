name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.2.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:content
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify migrations and idempotent seed
        env:
          SQLITE_PATH: /tmp/bonjotan-ci.sqlite
          SESSION_TOKEN_PEPPER: ci-session-pepper-not-for-production
          RECOVERY_CODE_PEPPER: ci-recovery-pepper-not-for-production
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://bonjohop.fun
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      VPS_APP_PATH: ${{ vars.VPS_APP_PATH }}
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "Missing VPS_SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS secret"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy main to VPS
        run: |
          : "${VPS_HOST:?Configure the VPS_HOST repository variable}"
          : "${VPS_USER:?Configure the VPS_USER repository variable}"
          : "${VPS_APP_PATH:?Configure the VPS_APP_PATH repository variable}"
          printf -v remote_path '%q' "$VPS_APP_PATH"
          ssh -i ~/.ssh/deploy_key \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd -- $remote_path && git fetch --prune origin main && git checkout main && git merge --ff-only origin/main && docker compose config --quiet && docker compose up -d --build --remove-orphans && docker compose ps"

      - name: Verify production health
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://bonjohop.fun/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
